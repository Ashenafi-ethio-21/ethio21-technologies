<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Space Obsidian Gradient with Subtle Top-Down Sheen -->
    <linearGradient id="squircleBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="35%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Sovereign Specular Rim: Pure Titanium to Electric Azure -->
    <linearGradient id="squircleRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Shadow Filter for iOS -->
    <filter id="iosDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- iOS Squircle Profile (Superellipse curvature standard) -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" 
        fill="url(#squircleBody)" 
        stroke="url(#squircleRim)" 
        stroke-width="2.5" 
        filter="url(#iosDrop)" />

  <!-- Diagonal Specular Highlight Sheen (Apple Liquid Glass) -->
  <path d="M 16,124 C 16,64 64,16 124,16 L 388,16 C 240,16 80,180 32,320 Z" 
        fill="white" 
        opacity="0.04" />

  <!-- Central Radial Core Bloom (Electric Azure) -->
  <circle cx="256" cy="270" r="130" fill="#00d2ff" opacity="0.1" filter="url(#innerGlow)" />

  <!-- Wordmark Lockup -->
  <g text-anchor="middle" filter="url(#innerGlow)">
    <!-- ETHIO (Pure Titanium White) -->
    <text x="256" y="225" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-weight="900" 
          font-size="84" 
          letter-spacing="5" 
          fill="#ffffff">
      ETHIO
    </text>

    <!-- 21 (Solid Sovereign Electric Azure - No Gradient) -->
    <text x="256" y="345" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-weight="900" 
          font-size="118" 
          letter-spacing="2" 
          fill="#00d2ff">
      21
    </text>
  </g>
</svg>
