<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="32" ry="32" 
        fill="url(#favBg)" 
        stroke="#00d2ff" 
        stroke-width="2.5" 
        stroke-opacity="0.4" />

  <!-- Micro Monogram: E 21 (Solid Non-Gradient) -->
  <text x="32" y="86" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="64" 
        fill="#ffffff">
    E
  </text>
  <text x="70" y="86" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-size="64" 
        fill="#00d2ff">
    21
  </text>
