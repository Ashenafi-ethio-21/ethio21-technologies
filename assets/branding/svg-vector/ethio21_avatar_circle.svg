<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Space Obsidian Radial Background -->
    <radialGradient id="avatarBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="60%" stop-color="#04060a" />
      <stop offset="100%" stop-color="#020305" />
    </radialGradient>

    <!-- Outer Specular Ring: Pure Titanium to Electric Azure -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Frosted Titanium for ETHIO -->
    <linearGradient id="avatarTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="48%" stop-color="#f1f5f9" />
      <stop offset="52%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Caustic Glow Filter -->
    <filter id="causticGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="avatarDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Circular Base (Telegram Safe Area) -->
  <circle cx="256" cy="256" r="256" fill="url(#avatarBg)" />

  <!-- Outer Specular Ring Guide -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.6" />
  <circle cx="256" cy="256" r="238" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.25" />

  <!-- Internal Ambient Glow -->
  <circle cx="256" cy="290" r="140" fill="#00d2ff" opacity="0.08" filter="url(#causticGlow)" />

  <!-- Stacked Wordmark Group -->
  <g filter="url(#avatarDrop)" text-anchor="middle">
    <!-- ETHIO -->
    <text x="256" y="215" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-weight="900" 
          font-size="88" 
          letter-spacing="6" 
          fill="url(#avatarTitanium)">
      ETHIO
    </text>

    <!-- 21 (Solid Sovereign Electric Azure - No Gradient) -->
    <text x="256" y="340" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" 
          font-weight="900" 
          font-size="124" 
          letter-spacing="2" 
          fill="#00d2ff">
      21
    </text>

    <!-- Minimalist Sub-Lettering -->
    <text x="256" y="395" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" 
          font-weight="800" 
          font-size="13" 
          letter-spacing="8" 
          fill="#94a3b8" 
          opacity="0.9">
      TECHNOLOGIES
    </text>
  </g>
</svg>
